name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff==0.14.1
      - run: ruff check app scripts tests
      - run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: work/*.log
